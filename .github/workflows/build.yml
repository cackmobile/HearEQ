name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HearEQ-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HearEQ.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HearEQ.apk \
            --title "HearEQ (latest build)" \
            --notes "Download HearEQ.apk on your phone, open it and allow the install."
